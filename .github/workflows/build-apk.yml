name: Build APK

on:
  push:
    paths:
      - 'android/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          unzip -q cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$HOME/android-sdk \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" 2>/dev/null

      - name: Generate Icons
        run: |
          pip install pillow -q
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw
          import os

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }

          for folder, size in sizes.items():
              path = f'android/app/src/main/res/{folder}'
              os.makedirs(path, exist_ok=True)
              
              # Buat icon dengan gradient
              img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              
              # Background circle
              draw.ellipse([0, 0, size-1, size-1], fill=(123, 47, 255, 255))
              
              # Text K
              font_size = size // 2
              draw.text((size//4, size//6), 'K', fill='white')
              
              img.save(f'{path}/ic_launcher.png')
              img.save(f'{path}/ic_launcher_round.png')
              print(f'Created {path} ({size}x{size})')
          PYEOF

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore android/kedai45.keystore \
            -alias kedai45 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass kedai45pass \
            -keypass kedai45pass \
            -dname "CN=Kedai45, OU=App, O=Kedai45, L=Jakarta, S=DKI, C=ID"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Build Release APK
        run: ./gradlew assembleRelease
        working-directory: android

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks android/kedai45.keystore \
            --ks-key-alias kedai45 \
            --ks-pass pass:kedai45pass \
            --key-pass pass:kedai45pass \
            --out android/app/build/outputs/apk/release/kedai45-signed.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kedai45-apk
          path: android/app/build/outputs/apk/release/kedai45-signed.apk
